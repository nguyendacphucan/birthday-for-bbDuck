<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Niệm Của Chúng Mình ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
            overflow-x: hidden;
            position: relative;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 450px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        h1 { color: #e84393; font-size: 24px; margin-bottom: 10px; }
        p { margin: 10px 0; font-size: 16px; line-height: 1.5; }
        .timer {
            background: #ffeaa7;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            color: #d63031;
            font-size: 18px;
            margin: 15px 0;
        }
        .letter {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #fd79a8;
            text-align: left;
            font-style: italic;
            margin-top: 15px;
            font-size: 14px;
        }
        /* Hiệu ứng trái tim bay */
        .heart {
            position: absolute;
            color: #ff7675;
            font-size: 20px;
            animation: float 4s linear infinite;
            bottom: -20px;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        button {
            background: #fd79a8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background: #e84393; }
    </style>
</head>
<body>

    <div class="container">
        <h1>❤️ Our Love Story ❤️</h1>
        <p>Chúng mình đã bên nhau được:</p>
        
        <div class="timer" id="timer">Đang tính số ngày...</div>

        <div class="letter">
            "Cảm ơn em/anh đã luôn ở bên cạnh, cùng chia sẻ những khoảnh khắc tuyệt vời nhất. Mong rằng chặng đường phía trước của chúng mình luôn đong đầy hạnh phúc!"
        </div>

        <button onclick="playAudio()">🎵 Bật nhạc nền nè</button>
        <audio id="myAudio" loop>
            <!-- Cậu có thể thay link nhạc mp3 tùy thích ở đây -->
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // --- THAY NGÀY BẮT ĐẦU YÊU VÀO ĐÂY (Năm, Tháng - 1, Ngày) ---
        // Lưu ý: Tháng trong JS bắt đầu từ 0 (Tháng 1 là 0, Tháng 12 là 11)
        const startDate = new Date(2025, 0, 1); // Ví dụ: Ngày 01/01/2025

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('timer').innerHTML = 
                `${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // Hiệu ứng trái tim bay
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);

            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createHeart, 300);

        function playAudio() {
            const audio = document.getElementById("myAudio");
            audio.play();
        }
    </script>
</body>
</html>
